<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Projeto Bootstrap - EBAC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">


  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body>


  <header class="bg-dark text-white text-center py-4">
    <h1>Projeto Bootstrap</h1>
  </header>


  <section class="container my-5">
    <div id="carouselExample" class="carousel slide" data-bs-ride="carousel">

      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="https://picsum.photos/1200/400?random=1" class="d-block w-100" alt="Imagem 1">
        </div>
        <div class="carousel-item">
          <img src="https://picsum.photos/1200/400?random=2" class="d-block w-100" alt="Imagem 2">
        </div>
        <div class="carousel-item">
          <img src="https://picsum.photos/1200/400?random=3" class="d-block w-100" alt="Imagem 3">
        </div>
      </div>

      <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
      </button>

      <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
      </button>

    </div>
  </section>


  <section class="container mb-5">
    <div class="row g-4">


      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100">
          <img src="https://picsum.photos/400/200?random=4" class="card-img-top" alt="Imagem card">
          <div class="card-body">
            <h5 class="card-title">Card 1</h5>
            <p class="card-text">
              Conteúdo exclusivo do cartão. Você pode escrever o que quiser aqui.
            </p>
            <a href="#" class="btn btn-primary">Saiba mais</a>
          </div>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100">
          <img src="https://picsum.photos/400/200?random=5" class="card-img-top" alt="Imagem card">
          <div class="card-body">
            <h5 class="card-title">Card 2</h5>
            <p class="card-text">
              Outro conteúdo exclusivo. Pode ser um serviço, produto ou descrição.
            </p>
            <a href="#" class="btn btn-primary">Saiba mais</a>
          </div>
        </div>
      </div>


      <div class="col-12 col-md-6 col-lg-4">
        <div class="card h-100">
          <img src="https://picsum.photos/400/200?random=6" class="card-img-top" alt="Imagem card">
          <div class="card-body">
            <h5 class="card-title">Card 3</h5>
            <p class="card-text">
              Texto livre, exclusivo, feito por você para o projeto.
            </p>
            <a href="#" class="btn btn-primary">Saiba mais</a>
          </div>
        </div>
      </div>

    </div>
  </section>


  <footer class="bg-dark text-white text-center py-3">
    <p>Projeto Bootstrap • EBAC</p>
  </footer>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
